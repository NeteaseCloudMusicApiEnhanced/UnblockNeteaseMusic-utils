name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Hermetic unit tests (no network, no dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The tests stub axios / @unblockneteasemusic/server / logger, so no
      # `npm install` is required (and the run stays fast and hermetic).
      - name: Run unit tests
        run: npm run test:unit
